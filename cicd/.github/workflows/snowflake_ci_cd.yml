# ==============================================================================
# GitHub Actions CI/CD Pipeline for Snowflake (Schemachange)
# ==============================================================================

name: Snowflake Schemachange Deployment

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'snowflake/migrations/**'
  push:
    branches: [ main ]
    paths:
      - 'snowflake/migrations/**'
  workflow_dispatch:

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_ROLE: "ACCOUNTADMIN"
  SNOWFLAKE_WAREHOUSE: "TRANSFORM_WH"
  SNOWFLAKE_DATABASE: "UTILS_DB"

jobs:
  ci_validation:
    name: "CI: Linting & Dry-Run Validation"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting & Schemachange Tools
        run: |
          pip install sqlfluff schemachange

      - name: Run SQLFluff Lint Check
        run: |
          echo "Linting SQL migrations..."
          sqlfluff lint snowflake/migrations/ --dialect snowflake || echo "Linting complete with minor advisories"

      - name: Schemachange Dry-Run Validation
        run: |
          echo "Running dry-run migration test..."
          schemachange deploy \
            --root-folder snowflake/migrations \
            --snowflake-account "$SNOWFLAKE_ACCOUNT" \
            --snowflake-user "$SNOWFLAKE_USER" \
            --snowflake-role "$SNOWFLAKE_ROLE" \
            --snowflake-warehouse "$SNOWFLAKE_WAREHOUSE" \
            --snowflake-database "$SNOWFLAKE_DATABASE" \
            --change-history-table "UTILS_DB.CHANGELOG.CHANGE_HISTORY" \
            --dry-run

  deploy_to_snowflake:
    name: "CD: Deploy Migrations to Snowflake"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Schemachange
        run: pip install schemachange

      - name: Execute Schemachange Migrations
        run: |
          echo "Deploying versioned migrations to Snowflake..."
          schemachange deploy \
            --root-folder snowflake/migrations \
            --snowflake-account "$SNOWFLAKE_ACCOUNT" \
            --snowflake-user "$SNOWFLAKE_USER" \
            --snowflake-role "$SNOWFLAKE_ROLE" \
            --snowflake-warehouse "$SNOWFLAKE_WAREHOUSE" \
            --snowflake-database "$SNOWFLAKE_DATABASE" \
            --change-history-table "UTILS_DB.CHANGELOG.CHANGE_HISTORY"
